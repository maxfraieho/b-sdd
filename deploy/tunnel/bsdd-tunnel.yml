# Cloudflare Tunnel Configuration: B-SDD Sovereign Gateway
# Ingress rules connecting edge hostname bsdd.exodus.pp.ua to local workbench server

tunnel: bsdd-gateway-tunnel
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # B-SDD REST and Realtime SSE Gateway
  - hostname: bsdd.exodus.pp.ua
    service: http://127.0.0.1:8765
    originRequest:
      connectTimeout: 5s
      noTLSVerify: false
      noChunkedEncoding: false
      keepAliveConnections: 100
      keepAliveTimeout: 90s
      http2Origin: false

  # Default fallback rule
  - service: http_status:404
