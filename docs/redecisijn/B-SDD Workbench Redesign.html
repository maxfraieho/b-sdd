<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

function AdrTimelineCard({ adr, validTimeDay, onSelect, selected }) {
  const parseDay = (iso) => parseInt(iso.split('T')[0].split('-')[2], 10);
  const startDay = parseDay(adr.date);
  const endDay = adr.valid_to ? parseDay(adr.valid_to) : null;
  const notYet = startDay > validTimeDay;
  const superseded = endDay !== null && validTimeDay >= endDay;
  const active = !notYet && !superseded;
  const state = active ? 'active' : superseded ? 'superseded' : 'pending';

  const cls = {
    active: selected
      ? 'bg-emerald/10 border-emerald ring-1 ring-emerald/40 shadow-[0_0_0_1px_rgba(16,185,129,0.15)]'
      : 'bg-card border-subtle hover:border-emerald/50',
    superseded: 'bg-panel/60 border-subtle opacity-55',
    pending: 'bg-panel border-dashed border-subtle opacity-70',
  }[state];

  return (
    <button
      onClick={() => onSelect(adr)}
      className={`shrink-0 w-56 text-left rounded-lg border px-3 py-2.5 transition-all ${cls}`}
    >
      <div className="flex items-center justify-between mb-1.5">

            ? 'text-emerald border-emerald/40 bg-emerald/10'
            : state === 'superseded'
              ? 'text-slate-500 border-slate-700 bg-slate-900/60 line-through'
              : 'text-cyan border-cyan/40 bg-cyan/10'

      <h4 className={`font-medium text-[11px] leading-snug line-clamp-2 ${state === 'active' ? 'text-slate-200' : 'text-slate-500'}`}>

      {adr.superseded_by && (
        <div className="flex items-center gap-1 text-[10px] text-amber/80 font-mono mt-1.5">

          <span className="font-bold">{adr.superseded_by}</span>

        <span className="tabular-nums">{adr.date}</span>

}

function TimelineSlider({
  validTimeDay, onValidTimeChange,
  txTimeDay, onTxTimeChange,
  adrs, activeAdrCount, supersededCount,
  onSelectAdr, selectedAdrId,
  minDay = 1, maxDay = 17,
}) {
  const [isPlaying, setIsPlaying] = useState(false);
  const railRef = useRef(null);

  useEffect(() => {
    if (!isPlaying) return;
    const t = setInterval(() => {
      onValidTimeChange(validTimeDay >= maxDay ? minDay : validTimeDay + 1);
    }, 900);
    return () => clearInterval(t);
  }, [isPlaying, validTimeDay, maxDay, minDay, onValidTimeChange]);

  const step = (d) => onValidTimeChange(Math.min(maxDay, Math.max(minDay, validTimeDay + d)));
  const scrollRail = (dir) => railRef.current?.scrollBy({ left: dir * 320, behavior: 'smooth' });

  const validDate = `2026-09-${String(validTimeDay).padStart(2, '0')}`;
  const txDate = `2026-09-${String(txTimeDay).padStart(2, '0')}`;

  return (
    <section
      aria-label="Bitemporal Timeline (Zone D)"
      className="flex border-t border-subtle bg-canvas shrink-0"
      style={{ height: 168 }}
    >
      {/* LEFT COLUMN — фіксована ширина w-64 */}
      <aside className="w-64 flex-shrink-0 border-r border-subtle bg-panel p-3 flex flex-col gap-2">
        <div className="flex items-center justify-between">
          <span className="text-[10px] font-mono uppercase tracking-widest text-amber font-bold">
            Bitemporal Lens
          </span>
          <div className="flex items-center gap-1.5 text-[10px] font-mono">
            <span className="flex items-center gap-1 text-emerald">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald animate-pulse" />
              {activeAdrCount}
            </span>
            <span className="text-slate-600">·</span>
            <span className="text-slate-500">{supersededCount} sup.</span>
          </div>
        </div>

        {/* T_v slot */}
        <div className="rounded-md border border-subtle bg-card px-2.5 py-1.5">
          <div className="flex items-center justify-between mb-1">
            <span className="flex items-center gap-1.5 text-[10px] font-mono font-semibold text-emerald">
              <span className="relative flex w-2 h-2">
                <span className="absolute inset-0 rounded-full bg-emerald opacity-70 animate-ping" />
                <span className="relative w-2 h-2 rounded-full bg-emerald" />
              </span>
              <Icons.Calendar size={12} />
              T_v
            </span>
            <span className="text-[11px] font-mono font-bold text-slate-100 tabular-nums">{validDate}</span>
          </div>
          <input
            type="range" min={minDay} max={maxDay}
            value={validTimeDay}
            onChange={(e) => onValidTimeChange(Number(e.target.value))}
            className="tv w-full cursor-pointer"
            aria-label="Valid Time scrubber"
          />
        </div>

        {/* T_t slot */}
        <div className="rounded-md border border-subtle bg-card px-2.5 py-1.5">
          <div className="flex items-center justify-between mb-1">
            <span className="flex items-center gap-1.5 text-[10px] font-mono font-semibold text-cyan">
              <span className="relative flex w-2 h-2">
                <span className="absolute inset-0 rounded-full bg-cyan opacity-70 animate-ping" />
                <span className="relative w-2 h-2 rounded-full bg-cyan" />
              </span>
              <Icons.History size={12} />
              T_t
            </span>
            <span className="text-[11px] font-mono font-bold text-slate-100 tabular-nums">{txDate}</span>
          </div>
          <input
            type="range" min={minDay} max={maxDay}
            value={txTimeDay}
            onChange={(e) => onTxTimeChange(Number(e.target.value))}
            className="tt w-full cursor-pointer"
            aria-label="Transaction Time scrubber"
          />
        </div>

        {/* Controls */}
        <div className="mt-auto flex items-center gap-1">
          <button onClick={() => step(-1)}
            className="flex-1 h-7 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-300 flex items-center justify-center transition-colors"
            title="Step back">
            <Icons.ChevronLeft />
          </button>
          <button onClick={() => setIsPlaying(v => !v)}
            className={`flex-1 h-7 rounded border flex items-center justify-center gap-1 font-mono text-[10px] font-bold transition-colors ${
              isPlaying ? 'bg-amber/15 border-amber/50 text-amber' : 'bg-card border-subtle text-slate-300 hover:bg-[#1a2233]'
            }`}
            title={isPlaying ? 'Pause Timeline' : 'Play Timeline'}>
            {isPlaying ? <Icons.Pause size={12}/> : <Icons.Play size={12}/>}
            {isPlaying ? 'PAUSE' : 'PLAY'}
          </button>
          <button onClick={() => step(1)}
            className="flex-1 h-7 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-300 flex items-center justify-center transition-colors"
            title="Step forward">
            <Icons.ChevronRight />
          </button>
          <button onClick={() => { setIsPlaying(false); onValidTimeChange(maxDay); onTxTimeChange(maxDay); }}
            className="w-7 h-7 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-400 hover:text-slate-100 flex items-center justify-center transition-colors"
            title="Reset to NOW">
            <Icons.RotateCcw size={12}/>
          </button>
        </div>
      </aside>

      {/* RIGHT COLUMN — flex-1 min-w-0, скролюється горизонтально */}
      <div className="flex-1 min-w-0 relative flex items-center">
        <div aria-hidden className="absolute inset-0 pointer-events-none opacity-40"
          style={{ backgroundImage: 'linear-gradient(to right, #1e293b 1px, transparent 1px)', backgroundSize: '80px 100%' }} />

        <button onClick={() => scrollRail(-1)}
          className="absolute left-1 z-10 w-6 h-6 rounded-full bg-panel/90 border border-subtle text-slate-400 hover:text-slate-100 flex items-center justify-center"
          title="Scroll rail left">
          <Icons.ChevronLeft />
        </button>
        <button onClick={() => scrollRail(1)}
          className="absolute right-1 z-10 w-6 h-6 rounded-full bg-panel/90 border border-subtle text-slate-400 hover:text-slate-100 flex items-center justify-center"
          title="Scroll rail right">
          <Icons.ChevronRight />
        </button>

        <div ref={railRef}
          className="flex-1 overflow-x-auto overflow-y-hidden p-3 flex gap-3 items-center min-w-0 scroll-smooth">
          {adrs.map(adr => (
            <AdrTimelineCard
              key={adr.id}
              adr={adr}
              validTimeDay={validTimeDay}
              onSelect={onSelectAdr}
              selected={adr.id === selectedAdrId}
            />
          ))}
        </div>
      </div>
    </section>
  );
}

window.TimelineSlider = TimelineSlider;
</script>

<!-- =========================================================================
     Drakon Canvas mock (renders MOCK_NODES; clicking a node → NodeInspector)
     ========================================================================= -->
<script type="text/babel" data-presets="react">
function DrakonCanvasMock({ schemaMode, nodes, onSelectNode, selectedNodeId }) {
  // Positions computed to visualise "shampur"
  const layout = {
    n1: { x: 220, y: 40 },
    n2: { x: 220, y: 140 },
    n3: { x: 220, y: 240 },
    n4: { x: 220, y: 360 },
    n5: { x: 400, y: 240 },
    n6: { x: 310, y: 460 },
  };

  const shape = (t) => t === 'question' ? 'rhomb' : t === 'end' ? 'pill' : t === 'headline' ? 'header' : 'rect';

  const renderNode = (n) => {
    const p = layout[n.node_id];
    const isSel = selectedNodeId === n.node_id;
    const w = shape(n.node_type) === 'header' ? 260 : 200;
    const h = shape(n.node_type) === 'rhomb' ? 90 : 56;
    return (
      <g key={n.node_id} onClick={() => onSelectNode(n)} style={{ cursor: 'pointer' }}>
        {shape(n.node_type) === 'rhomb' ? (
          <polygon points={`${p.x},${p.y - h/2} ${p.x + w/2},${p.y} ${p.x},${p.y + h/2} ${p.x - w/2},${p.y}`}
            fill={isSel ? '#f59e0b22' : '#141b27'}
            stroke={isSel ? '#f59e0b' : '#1e293b'} strokeWidth={isSel ? 2 : 1.2} />
        ) : (
          <rect
            x={p.x - w/2} y={p.y - h/2} width={w} height={h}
            rx={shape(n.node_type) === 'pill' ? h/2 : 6}
            fill={shape(n.node_type) === 'header' ? '#0d121c' : (isSel ? '#141b27' : '#141b27')}
            stroke={isSel ? '#f59e0b' : (shape(n.node_type) === 'header' ? '#f59e0b55' : '#1e293b')}
            strokeWidth={isSel ? 2 : 1.2}
          />
        )}
        <text x={p.x} y={p.y + 4} textAnchor="middle"
              fontFamily="JetBrains Mono" fontSize="11"
              fill={shape(n.node_type) === 'header' ? '#f59e0b' : '#e2e8f0'}
              style={{ pointerEvents: 'none' }}>
          {n.label.length > 32 ? n.label.slice(0, 30) + '…' : n.label}
        </text>
        {n.semantic_binding && (
          <g style={{ pointerEvents: 'none' }}>
            <rect x={p.x + w/2 - 46} y={p.y - h/2 + 4} width={42} height={14} rx={2}
                  fill="#f59e0b22" stroke="#f59e0b55" />
            <text x={p.x + w/2 - 25} y={p.y - h/2 + 14} textAnchor="middle"
                  fontFamily="JetBrains Mono" fontSize="9" fill="#f59e0b">INV</text>
          </g>
        )}
      </g>
    );
  };

  const renderEdge = (from, to, label, color = '#334155') => {
    const a = layout[from], b = layout[to];
    if (!a || !b) return null;
    return (
      <g key={`${from}->${to}`}>
        <path d={`M ${a.x} ${a.y + 28} L ${b.x} ${b.y - 28}`}
              stroke={color} strokeWidth="1.5" fill="none" markerEnd="url(#arrow)" />
        {label && (
          <text x={(a.x + b.x) / 2 + 8} y={(a.y + b.y) / 2}
                fontFamily="JetBrains Mono" fontSize="10" fill={color}>{label}</text>
        )}
      </g>
    );
  };

  return (
    <div className="flex-1 relative overflow-hidden bg-canvas">
      {/* dot grid */}
      <div className="absolute inset-0 grid-bg opacity-70" aria-hidden />
      {schemaMode === 'structure' && (
        <div className="absolute top-3 left-3 text-[10px] font-mono uppercase tracking-widest text-cyan/80 px-2 py-1 rounded bg-cyan/10 border border-cyan/30">
          Structure mode — читання дерева фаз
        </div>
      )}
      {schemaMode === 'logic' && (
        <div className="absolute top-3 left-3 text-[10px] font-mono uppercase tracking-widest text-amber/80 px-2 py-1 rounded bg-amber/10 border border-amber/30">
          Logic mode — редагування шампура
        </div>
      )}

      <svg viewBox="0 0 620 520" className="w-full h-full">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L6,3 z" fill="#64748b" />
          </marker>
        </defs>
        {renderEdge('n1', 'n2')}
        {renderEdge('n2', 'n3')}
        {renderEdge('n3', 'n4', 'Так', '#10b981')}
        {renderEdge('n3', 'n5', 'Ні (worse)', '#f43f5e')}
        {renderEdge('n4', 'n6')}
        {renderEdge('n5', 'n6')}
        {nodes.map(renderNode)}
      </svg>

      <div className="absolute bottom-3 right-3 flex items-center gap-1.5 text-[10px] font-mono text-slate-500">
        <span className="inline-flex items-center gap-1"><span className="w-2 h-2 bg-emerald rounded-sm"/>Так</span>
        <span className="inline-flex items-center gap-1"><span className="w-2 h-2 bg-rose rounded-sm"/>Ні · worse</span>
      </div>
    </div>
  );
}
window.DrakonCanvasMock = DrakonCanvasMock;
</script>

<!-- =========================================================================
     Node Inspector Modal
     ========================================================================= -->
<script type="text/babel" data-presets="react">
function NodeInspectorModal({ node, allNodes, adrs, onClose, onUpdateNode, onDeleteNode }) {
  const [label, setLabel] = useState('');
  const [nodeType, setNodeType] = useState('action');
  const [downEdge, setDownEdge] = useState('');
  const [rightEdge, setRightEdge] = useState('');
  const [invariantId, setInvariantId] = useState('');
  const [severity, setSeverity] = useState('normal');
  const [routing, setRouting] = useState('one');
  const [isSaved, setIsSaved] = useState(false);

  useEffect(() => {
    if (!node) return;
    setLabel(node.label || '');
    setNodeType(node.node_type || 'action');
    setDownEdge(node.edges?.down || '');
    setRightEdge(node.edges?.right || '');
    setInvariantId(node.semantic_binding?.adr_invariant_id || '');
    setSeverity(node.semantic_binding?.severity || 'normal');
    setRouting(node.edges?.right ? 'two' : 'one');
    setIsSaved(false);
  }, [node]);

  useEffect(() => {
    if (nodeType === 'question' && routing === 'one') setRouting('two');
  }, [nodeType]);

  if (!node) return null;

  const otherNodes = allNodes.filter(n => n.node_id !== node.node_id);
  const availableInvariants = adrs.flatMap(a => (a.invariants || []).map(inv => ({
    id: inv.id, adrId: a.id, title: inv.statement,
  })));

  const handleSave = () => {
    onUpdateNode({
      ...node,
      label,
      node_type: nodeType,
      edges: { down: downEdge || null, right: routing === 'two' ? rightEdge || null : null },
      semantic_binding: invariantId ? { adr_invariant_id: invariantId, severity } : undefined,
    });
    setIsSaved(true);
    setTimeout(() => setIsSaved(false), 1500);
  };

  const NODE_TYPES = [
    { value: 'action',   label: 'action',   hint: 'Дія' },
    { value: 'question', label: 'question', hint: 'Умова ТАК/НІ' },
    { value: 'headline', label: 'headline', hint: 'Заголовок' },
    { value: 'address',  label: 'address',  hint: 'Маршрут / силует' },
    { value: 'end',      label: 'end',      hint: 'Кінець' },
  ];

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
      <div className="w-full max-w-2xl bg-card border border-subtle rounded-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
        <header className="flex items-center justify-between px-4 py-3 bg-panel border-b border-subtle shrink-0">
          <div className="flex items-center gap-2">
            <Icons.FileCode className="text-amber" />
            <span className="font-mono font-bold text-slate-100 text-sm">Редактор вузла DRAKON</span>
            <span className="font-mono text-[10px] text-amber px-1.5 py-0.5 rounded bg-amber/10 border border-amber/30">
              #{node.node_id}
            </span>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-100 p-1 rounded hover:bg-[#1a2233]">
            <Icons.X />
          </button>
        </header>

        <div className="flex-1 overflow-y-auto p-4 space-y-3 text-xs">
          <div className="grid grid-cols-3 gap-3">
            <div className="col-span-2">
              <label className="text-[10px] font-mono uppercase text-slate-400 block mb-1">Назва вузла</label>
              <input value={label} onChange={e => setLabel(e.target.value)}
                placeholder="Опишіть дію або запитання…"
                className="w-full h-8 bg-canvas border border-subtle rounded px-2.5 text-slate-100 font-sans text-xs focus:border-amber focus:outline-none focus:ring-1 focus:ring-amber/30"/>
            </div>
            <div>
              <label className="text-[10px] font-mono uppercase text-slate-400 block mb-1">Тип</label>
              <select value={nodeType} onChange={e => setNodeType(e.target.value)}
                className="w-full h-8 bg-canvas border border-subtle rounded px-2 text-slate-100 font-mono text-xs focus:border-amber focus:outline-none">
                {NODE_TYPES.map(t => (
                  <option key={t.value} value={t.value}>{t.label} — {t.hint}</option>
                ))}
              </select>
            </div>
          </div>

          <div>
            <label className="text-[10px] font-mono uppercase text-slate-400 block mb-1">Детальний текст / Інструкція</label>
            <textarea value={label} onChange={e => setLabel(e.target.value)} rows={3}
              className="w-full bg-canvas border border-subtle rounded p-2.5 text-slate-100 font-sans text-xs focus:border-amber focus:outline-none resize-none leading-relaxed"/>
          </div>

          <div className="rounded border border-subtle bg-panel p-3">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[10px] font-mono uppercase text-slate-400 font-semibold">Маршрутизація</span>
              <div className="inline-flex bg-canvas border border-subtle rounded p-0.5">
                {['one','two'].map(r => (
                  <button key={r} disabled={nodeType === 'question' && r === 'one'}
                    onClick={() => setRouting(r)}
                    className={`px-2.5 h-6 rounded text-[10px] font-mono transition-all ${
                      routing === r ? 'bg-card text-amber font-bold' : 'text-slate-400 hover:text-slate-200 disabled:opacity-40'
                    }`}>
                    {r === 'one' ? '1 — Down' : '2 — Down + Right'}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2.5">
              <div>
                <label className="text-[11px] font-mono text-emerald flex items-center gap-1 mb-1">
                  <Icons.ArrowDown size={12}/>
                  {nodeType === 'question' ? 'ТАК (Down):' : 'Down:'}
                </label>
                <select value={downEdge} onChange={e => setDownEdge(e.target.value)}
                  className="w-full h-7 bg-canvas border border-subtle rounded px-2 text-slate-200 font-mono text-[11px] focus:border-amber focus:outline-none">
                  <option value="">— кінець гілки —</option>
                  {otherNodes.map(n => (
                    <option key={n.node_id} value={n.node_id}>[{n.node_type}] #{n.node_id} — {(n.label||'').slice(0,28)}</option>
                  ))}
                </select>
              </div>
              <div className={routing === 'one' ? 'opacity-40 pointer-events-none' : ''}>
                <label className="text-[11px] font-mono text-rose flex items-center gap-1 mb-1">
                  <Icons.CornerDownRight size={12}/>
                  {nodeType === 'question' ? 'НІ (Right):' : 'Right:'}
                </label>
                <select value={rightEdge} onChange={e => setRightEdge(e.target.value)}
                  className="w-full h-7 bg-canvas border border-subtle rounded px-2 text-slate-200 font-mono text-[11px] focus:border-amber focus:outline-none">
                  <option value="">— немає розгалуження —</option>
                  {otherNodes.map(n => (
                    <option key={n.node_id} value={n.node_id}>[{n.node_type}] #{n.node_id} — {(n.label||'').slice(0,28)}</option>
                  ))}
                </select>
              </div>
            </div>
            <p className="text-[10px] text-slate-500 font-mono mt-2">
              Правило «Right is Worse»: права гілка веде до обробки помилки або відкату.
            </p>
          </div>

          <div className="rounded border border-subtle bg-panel p-3">
            <div className="flex items-center gap-1.5 text-xs font-semibold text-amber mb-2">
              <Icons.Shield />
              Прив'язка до інваріанту ADR
            </div>
            <div className="grid grid-cols-3 gap-2.5">
              <div className="col-span-2">
                <label className="text-[10px] font-mono uppercase text-slate-400 block mb-1">adr_invariant_id</label>
                <select value={invariantId} onChange={e => setInvariantId(e.target.value)}
                  className="w-full h-7 bg-canvas border border-subtle rounded px-2 text-slate-200 font-mono text-[11px] focus:border-amber focus:outline-none">
                  <option value="">— без прив'язки —</option>
                  {availableInvariants.map(inv => (
                    <option key={inv.id} value={inv.id}>{inv.id} · {inv.title.slice(0,40)}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="text-[10px] font-mono uppercase text-slate-400 block mb-1">Severity</label>
                <div className="flex gap-1">
                  {['normal','severe','fatal'].map(s => {
                    const isActive = severity === s;
                    const tone = s === 'fatal'
                      ? 'bg-rose/20 text-rose border-rose/50'
                      : s === 'severe'
                        ? 'bg-amber/20 text-amber border-amber/50'
                        : 'bg-emerald/20 text-emerald border-emerald/50';
                    return (
                      <button key={s} type="button" onClick={() => setSeverity(s)}
                        disabled={!invariantId}
                        className={`flex-1 h-7 rounded border text-[10px] font-mono uppercase transition-colors ${
                          isActive ? tone : 'bg-canvas text-slate-500 border-subtle hover:text-slate-300 disabled:opacity-40'
                        }`}>
                        {s.slice(0,3)}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer className="flex items-center justify-between px-4 py-3 bg-panel border-t border-subtle shrink-0">
          <button onClick={() => onDeleteNode(node.node_id)}
            className="inline-flex items-center gap-1.5 h-8 px-3 rounded border border-rose/50 bg-rose/10 text-rose hover:bg-rose/20 text-xs font-mono font-semibold transition-colors">
            <Icons.Trash2 />
            Видалити
          </button>
          <div className="flex items-center gap-2">
            <button onClick={onClose}
              className="h-8 px-3 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-300 text-xs font-mono transition-colors">
              Скасувати
            </button>
            <button onClick={handleSave}
              className="inline-flex items-center gap-1.5 h-8 px-4 rounded bg-emerald hover:bg-emerald/90 text-slate-950 text-xs font-mono font-bold shadow-sm">
              {isSaved ? <Icons.Check/> : <Icons.Save/>}
              {isSaved ? 'Збережено' : 'Застосувати зміни'}
            </button>
          </div>
        </footer>
      </div>
    </div>
  );
}
window.NodeInspectorModal = NodeInspectorModal;
</script>

<!-- =========================================================================
     ADR Library Modal — Reader + Editor + Amend
     ========================================================================= -->
<script type="text/babel" data-presets="react">
function AdrLibraryModal({ isOpen, onClose, adrs, onSaveAdr, onCreateAdr }) {
  const [q, setQ] = useState('');
  const [selectedId, setSelectedId] = useState(adrs[0]?.id || '');
  const [mode, setMode] = useState('read');
  const [draft, setDraft] = useState(null);
  const [copiedInv, setCopiedInv] = useState(null);

  if (!isOpen) return null;

  const filtered = adrs.filter(a =>
    a.title.toLowerCase().includes(q.toLowerCase()) ||
    a.id.toLowerCase().includes(q.toLowerCase()) ||
    (a.content || '').toLowerCase().includes(q.toLowerCase()),
  );

  const current = filtered.find(a => a.id === selectedId) || filtered[0] || adrs[0] || null;

  const emptyDraft = (nextId) => ({
    id: nextId, title: '', status: 'proposed',
    date: new Date().toISOString().slice(0,10),
    valid_from: new Date().toISOString(),
    invariants: [],
    content: `# ${nextId} — <TITLE>\n\n## Context\n\n## Decision\n\n## Consequences\n\n## Invariants\n`,
  });

  const startNew = () => {
    const nextNum = String(adrs.length + 1).padStart(3, '0');
    setDraft(emptyDraft(`ADR-${nextNum}`));
    setMode('edit');
  };
  const startEdit = () => {
    if (!current) return;
    setDraft({ ...current });
    setMode('edit');
  };
  const startAmend = () => {
    if (!current) return;
    const nextNum = String(adrs.length + 1).padStart(3, '0');
    setDraft({
      ...emptyDraft(`ADR-${nextNum}`),
      title: `${current.title} (Amended)`,
      content: `# ADR-${nextNum} — ${current.title} (Amended)\n\n> Supersedes **${current.id}**.\n\n## Context\n\n## Decision\n\n## Consequences\n\n## Invariants\n`,
    });
    setMode('edit');
  };
  const commit = (publish) => {
    if (!draft) return;
    const finalAdr = { ...draft, status: publish ? 'accepted' : 'proposed' };
    if (adrs.some(a => a.id === draft.id)) onSaveAdr?.(finalAdr);
    else onCreateAdr?.(finalAdr);
    setMode('read');
    setDraft(null);
    setSelectedId(finalAdr.id);
  };
  const copyInv = (id) => {
    navigator.clipboard?.writeText(id);
    setCopiedInv(id);
    setTimeout(() => setCopiedInv(null), 1500);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
      <div className="w-full max-w-6xl bg-card border border-subtle rounded-lg shadow-2xl flex flex-col overflow-hidden max-h-[90vh]">
        {/* Header */}
        <div className="flex items-center justify-between px-4 py-3 border-b border-subtle bg-panel shrink-0">
          <div className="flex items-center gap-2.5">
            <Icons.BookOpen className="text-emerald"/>
            <div>
              <div className="text-sm font-bold text-slate-100 font-mono">
                Бібліотека Архітектурних Рішень · MADR 3.0
              </div>
              <span className="text-[11px] text-slate-400 font-mono">
                {adrs.length} документів · Reader + Editor + Amend
              </span>
            </div>
          </div>
          <button onClick={onClose} className="p-1 rounded text-slate-400 hover:text-slate-100 hover:bg-[#1a2233]">
            <Icons.X />
          </button>
        </div>

        {/* Body */}
        <div className="flex-1 flex overflow-hidden" style={{ minHeight: 520 }}>
          {/* LEFT LIST */}
          <aside className="w-80 shrink-0 border-r border-subtle bg-panel/60 flex flex-col">
            <div className="p-3 border-b border-subtle space-y-2">
              <div className="relative">
                <span className="absolute left-2.5 top-2 text-slate-400"><Icons.Search size={12}/></span>
                <input placeholder="Пошук ADR або INV…" value={q} onChange={e => setQ(e.target.value)}
                  className="w-full h-8 bg-canvas border border-subtle rounded pl-8 pr-3 text-xs text-slate-200 placeholder-slate-500 font-mono focus:border-amber focus:outline-none"/>
              </div>
              <button onClick={startNew}
                className="w-full h-8 inline-flex items-center justify-center gap-1.5 rounded bg-amber hover:bg-amber/90 text-slate-950 text-xs font-mono font-bold shadow-sm">
                <Icons.Plus /> Новий ADR
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-2 space-y-1.5">
              {filtered.map(adr => {
                const isSel = adr.id === current?.id;
                const tone = adr.status === 'accepted' ? 'emerald' : adr.status === 'superseded' ? 'neutral' : 'cyan';
                const toneCls = {
                  emerald: 'text-emerald border-emerald/40 bg-emerald/10',
                  neutral: 'text-slate-400 border-slate-700 bg-slate-900/40',
                  cyan: 'text-cyan border-cyan/40 bg-cyan/10',
                }[tone];
                return (
                  <button key={adr.id}
                    onClick={() => { setSelectedId(adr.id); setMode('read'); setDraft(null); }}
                    className={`w-full text-left p-2.5 rounded border text-xs transition-all ${
                      isSel ? 'bg-[#1a2233] border-amber/60' : 'bg-card/60 border-subtle hover:bg-[#1a2233] hover:border-slate-600'
                    }`}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="font-mono font-bold text-amber">{adr.id}</span>
                      <span className={`text-[9px] font-mono uppercase px-1.5 py-0.5 rounded border ${toneCls}`}>
                        {adr.status}
                      </span>
                    </div>
                    <h4 className="font-medium text-slate-200 line-clamp-2 text-[11px]">{adr.title}</h4>
                    <div className="flex items-center justify-between text-[10px] text-slate-500 mt-2 font-mono">
                      <span>{adr.invariants.length} INV</span>
                      <span className="tabular-nums">{adr.date}</span>
                    </div>
                  </button>
                );
              })}
            </div>
          </aside>

          {/* RIGHT: reader OR editor */}
          <div className="flex-1 flex flex-col bg-canvas overflow-hidden">
            {current && mode === 'read' && (
              <>
                <div className="px-5 py-3 bg-panel border-b border-subtle flex items-center justify-between shrink-0">
                  <div className="space-y-0.5 min-w-0">
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-mono px-1.5 py-0.5 rounded border border-amber/40 text-amber bg-amber/10">{current.id}</span>
                      <span className="text-xs font-bold text-slate-100 font-mono truncate">{current.title}</span>
                    </div>
                    <div className="flex items-center gap-3 text-[10px] text-slate-500 font-mono">
                      {current.file_path && <code>{current.file_path}</code>}
                      <span className="flex items-center gap-1"><Icons.Calendar size={11} className="text-amber"/>{current.date}</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button onClick={startEdit}
                      className="inline-flex items-center gap-1.5 h-7 px-2.5 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-200 text-xs font-mono">
                      <Icons.Pencil /> Редагувати
                    </button>
                    <button onClick={startAmend}
                      className="inline-flex items-center gap-1.5 h-7 px-2.5 rounded border border-violet/40 bg-violet/10 hover:bg-violet/20 text-violet text-xs font-mono font-bold"
                      title="Створити ADR що замінює цей (superseded_by)">
                      <Icons.GitBranch /> Amend
                    </button>
                  </div>
                </div>

                {current.invariants?.length > 0 && (
                  <div className="px-5 py-2 bg-panel/80 border-b border-subtle flex items-center gap-2 overflow-x-auto text-[11px] font-mono shrink-0">
                    <span className="text-amber font-semibold flex items-center gap-1 shrink-0"><Icons.Shield /> Інваріанти:</span>
                    {current.invariants.map(inv => (
                      <div key={inv.id} className="px-2 py-0.5 rounded bg-card border border-subtle text-slate-300 flex items-center gap-1.5 shrink-0">
                        <span className="text-amber font-bold">{inv.id}</span>
                        <button onClick={() => copyInv(inv.id)} className="hover:text-slate-100" title="Копіювати">
                          {copiedInv === inv.id ? <Icons.Check className="text-emerald"/> : <Icons.Copy className="text-slate-500"/>}
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                <div className="flex-1 overflow-y-auto p-6 font-mono text-[13px] leading-relaxed bg-canvas text-slate-200 whitespace-pre-wrap">
                  {current.content || <div className="text-slate-500 text-center p-8">Немає тіла документа.</div>}
                </div>
              </>
            )}

            {mode === 'edit' && draft && (
              <>
                <div className="px-5 py-3 bg-panel border-b border-subtle flex items-center justify-between shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded border border-cyan/40 text-cyan bg-cyan/10">{draft.id}</span>
                    <span className="text-xs font-bold text-slate-100 font-mono">Editor · MADR 3.0</span>
                    <span className="text-[10px] text-slate-500 font-mono">{draft.status}</span>
                  </div>
                  <button onClick={() => { setMode('read'); setDraft(null); }}
                    className="inline-flex items-center gap-1.5 h-7 px-2.5 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-300 text-xs font-mono">
                    <Icons.Eye /> Read Mode
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                  <div className="grid grid-cols-3 gap-3">
                    <div className="col-span-2">
                      <label className="text-[10px] font-mono uppercase text-slate-400 block mb-1">Title</label>
                      <input value={draft.title} onChange={e => setDraft({...draft, title: e.target.value})}
                        placeholder="Коротке декларативне рішення…"
                        className="w-full h-8 bg-canvas border border-subtle rounded px-2.5 text-slate-100 text-sm font-sans focus:border-amber focus:outline-none"/>
                    </div>
                    <div>
                      <label className="text-[10px] font-mono uppercase text-slate-400 block mb-1">Status</label>
                      <select value={draft.status} onChange={e => setDraft({...draft, status: e.target.value})}
                        className="w-full h-8 bg-canvas border border-subtle rounded px-2 text-slate-100 font-mono text-xs focus:border-amber focus:outline-none">
                        <option value="proposed">proposed</option>
                        <option value="accepted">accepted</option>
                        <option value="deprecated">deprecated</option>
                        <option value="superseded">superseded</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] font-mono uppercase text-slate-400 block mb-1">MADR body (Markdown)</label>
                    <textarea value={draft.content} rows={14}
                      onChange={e => setDraft({...draft, content: e.target.value})}
                      className="w-full bg-canvas border border-subtle rounded p-3 text-slate-200 font-mono text-[12px] leading-relaxed focus:border-amber focus:outline-none resize-y"/>
                    <p className="text-[10px] text-slate-500 font-mono mt-1">
                      Sections: <span className="text-amber">Context</span> · <span className="text-amber">Decision</span> · <span className="text-amber">Consequences</span> · <span className="text-amber">Invariants</span>
                    </p>
                  </div>

                  <div className="rounded border border-subtle bg-panel p-3">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-mono uppercase text-slate-400 font-semibold flex items-center gap-1.5">
                        <Icons.Shield className="text-amber"/>
                        Інваріанти ({(draft.invariants || []).length})
                      </span>
                      <button onClick={() => {
                        const nextNum = String((draft.invariants?.length || 0) + 1).padStart(2, '0');
                        setDraft({ ...draft, invariants: [...(draft.invariants || []), { id: `INV-NEW-${nextNum}`, statement: '' }]});
                      }}
                        className="inline-flex items-center gap-1 h-6 px-2 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-300 text-[11px] font-mono">
                        <Icons.ShieldPlus className="text-emerald"/>+ INV
                      </button>
                    </div>
                    <div className="space-y-1.5">
                      {(draft.invariants || []).map((inv, idx) => (
                        <div key={idx} className="flex items-center gap-2">
                          <input value={inv.id}
                            onChange={e => { const next = [...draft.invariants]; next[idx] = {...next[idx], id: e.target.value}; setDraft({...draft, invariants: next}); }}
                            className="w-32 h-7 bg-canvas border border-subtle rounded px-2 text-amber font-mono text-[11px] focus:border-amber focus:outline-none"/>
                          <input value={inv.statement}
                            onChange={e => { const next = [...draft.invariants]; next[idx] = {...next[idx], statement: e.target.value}; setDraft({...draft, invariants: next}); }}
                            placeholder="Формулювання інваріанту…"
                            className="flex-1 h-7 bg-canvas border border-subtle rounded px-2 text-slate-200 text-[11px] focus:border-amber focus:outline-none"/>
                          <button onClick={() => setDraft({ ...draft, invariants: draft.invariants.filter((_,i) => i !== idx) })}
                            className="w-7 h-7 rounded border border-subtle text-slate-500 hover:text-rose hover:border-rose/40 flex items-center justify-center">
                            <Icons.Trash2 />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <footer className="flex items-center justify-between px-5 py-3 bg-panel border-t border-subtle shrink-0">
                  <button onClick={() => { setMode('read'); setDraft(null); }}
                    className="h-8 px-3 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-300 text-xs font-mono">
                    Скасувати
                  </button>
                  <div className="flex items-center gap-2">
                    <button onClick={() => commit(false)}
                      className="inline-flex items-center gap-1.5 h-8 px-3 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-200 text-xs font-mono">
                      <Icons.Save /> Save Draft
                    </button>
                    <button onClick={() => commit(true)}
                      className="inline-flex items-center gap-1.5 h-8 px-4 rounded bg-emerald hover:bg-emerald/90 text-slate-950 text-xs font-mono font-bold shadow-sm">
                      <Icons.Check /> Publish (accepted)
                    </button>
                  </div>
                </footer>
              </>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}
window.AdrLibraryModal = AdrLibraryModal;
</script>

<!-- =========================================================================
     Top bar (Zone A) + Left rail (Zone C) + right copilot (Zone E) — light mocks

<script type="text/babel" data-presets="react">
function TopBar({ onOpenAdrLibrary }) {
  return (
    <header className="h-11 bg-panel border-b border-subtle px-3 flex items-center justify-between shrink-0">
      <div className="flex items-center gap-3">
        <button className="w-7 h-7 rounded hover:bg-[#1a2233] text-slate-400 hover:text-slate-100 inline-flex items-center justify-center">
          <Icons.MenuIco />
        </button>
        <div className="flex items-center gap-2">
          <span className="w-6 h-6 rounded bg-amber/20 border border-amber/40 flex items-center justify-center">
            <span className="font-mono text-amber font-bold text-[11px]">B</span>
          </span>
          <span className="font-mono font-bold text-slate-100 text-sm">B-SDD</span>
          <span className="text-slate-500 font-mono text-[11px]">/ Workbench</span>
        </div>
        <span className="text-[10px] font-mono px-1.5 py-0.5 rounded border border-emerald/40 text-emerald bg-emerald/10">
          maxfraieho/b-sdd · main
        </span>
      </div>
      <div className="flex items-center gap-1.5">
        <button onClick={onOpenAdrLibrary}
          className="inline-flex items-center gap-1.5 h-7 px-2.5 rounded border border-subtle bg-card hover:bg-[#1a2233] text-slate-200 text-xs font-mono">
          <Icons.BookOpen /> ADR Library
        </button>
        <button className="w-7 h-7 rounded hover:bg-[#1a2233] text-slate-400 hover:text-slate-100 inline-flex items-center justify-center">
          <Icons.Bell />
        </button>

<!-- =========================================================================
     Root App
     ========================================================================= -->
<script type="text/babel" data-presets="react">
function App() {
  const [validTimeDay, setValidTimeDay] = useState(17);
  const [txTimeDay, setTxTimeDay] = useState(17);
  const [adrs, setAdrs] = useState(MOCK_ADRS);
  const [selectedAdrId, setSelectedAdrId] = useState('ADR-008');
  const [nodes, setNodes] = useState(MOCK_NODES);
  const [selectedNode, setSelectedNode] = useState(null);
  const [schemaMode, setSchemaMode] = useState('logic');
  const [adrLibraryOpen, setAdrLibraryOpen] = useState(false);
  const [activeSocketType, setActiveSocketType] = useState(null);

  const activeAdrCount = useMemo(() => adrs.filter(a => {
    const startDay = parseInt(a.date.split('-')[2], 10);
    const endDay = a.valid_to ? parseInt(a.valid_to.split('T')[0].split('-')[2], 10) : null;
    return startDay <= validTimeDay && (endDay === null || validTimeDay < endDay);
  }).length, [adrs, validTimeDay]);
  const supersededCount = adrs.filter(a => a.status === 'superseded').length;

  const updateNode = (n) => {
    setNodes(prev => prev.map(x => x.node_id === n.node_id ? n : x));
    setSelectedNode(null);
  };
  const deleteNode = (id) => {
    setNodes(prev => prev.filter(x => x.node_id !== id));
    setSelectedNode(null);
  };

  return (
    <div className="h-screen w-screen flex flex-col bg-canvas text-slate-100 overflow-hidden select-none font-sans">
      <TopBar onOpenAdrLibrary={() => setAdrLibraryOpen(true)} />

      <div className="flex-1 flex overflow-hidden">
        <LeftRail />

        <main className="flex-1 flex flex-col overflow-hidden">
          {/* Zone B: Toolbar + Palette */}
          <DrakonToolbar
            diagramName="bsdd_preflight_pipeline.drakon.json"
            schemaMode={schemaMode}
            onSchemaModeChange={setSchemaMode}
            onOpenAdrLibrary={() => setAdrLibraryOpen(true)}
          />
          <DrakonIconPalette
            onInsertIcon={(t) => setActiveSocketType(prev => prev === t ? null : t)}
            activeSocketType={activeSocketType}
          />

          {/* Zone B: Canvas */}
          <DrakonCanvasMock
            schemaMode={schemaMode}
            nodes={nodes}
            onSelectNode={setSelectedNode}
            selectedNodeId={selectedNode?.node_id}
          />

          {/* Zone D: Bitemporal Timeline */}
          <TimelineSlider
            validTimeDay={validTimeDay}
            onValidTimeChange={setValidTimeDay}
            txTimeDay={txTimeDay}
            onTxTimeChange={setTxTimeDay}
            adrs={adrs}
            activeAdrCount={activeAdrCount}
            supersededCount={supersededCount}
            onSelectAdr={(a) => { setSelectedAdrId(a.id); setAdrLibraryOpen(true); }}
            selectedAdrId={selectedAdrId}
          />
        </main>

        <CopilotPanel />
      </div>

      {/* Modals */}
      <NodeInspectorModal
        node={selectedNode}
        allNodes={nodes}
        adrs={adrs}
        onClose={() => setSelectedNode(null)}
        onUpdateNode={updateNode}
        onDeleteNode={deleteNode}
      />
      <AdrLibraryModal
        isOpen={adrLibraryOpen}
        onClose={() => setAdrLibraryOpen(false)}
        adrs={adrs}
        onSaveAdr={(a) => setAdrs(prev => prev.map(x => x.id === a.id ? a : x))}
        onCreateAdr={(a) => setAdrs(prev => [...prev, a])}
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
